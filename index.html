<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<title>Tailers World LV</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Tailers World LV – mini spēļu pasaule">
<style>
  :root{--bg:#0f0d1f;--card:#1b1830;--line:#ffffff1a;--text:#f3f1ff;--muted:#a9a4c7;--accent:#ff5fa2;--accent2:#ffd34d}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:radial-gradient(1200px 600px at 20% -10%,#3a2357 0%,transparent 60%),radial-gradient(900px 500px at 110% 10%,#1e3a6b 0%,transparent 55%),var(--bg);
    color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
  .wrap{max-width:1100px;margin:0 auto;padding:48px 16px 64px}
  header{display:flex;align-items:center;gap:16px;margin-bottom:8px}
  .logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:28px;box-shadow:0 8px 30px #ff5fa255}
  .brand{font-weight:800;letter-spacing:.5px;color:var(--muted)}
  h1{font-size:clamp(40px,7vw,72px);margin:24px 0 4px;line-height:1.05}
  h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .lead{color:var(--muted);font-size:18px;max-width:620px;margin:0 0 36px}
  h2{font-size:20px;margin:0 0 16px;color:var(--text)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
  .card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:transform .18s,box-shadow .18s,border-color .18s}
  .card:hover,.card:focus-visible{transform:translateY(-4px);box-shadow:0 18px 40px #0008;border-color:#ffffff40;outline:none}
  .thumb{aspect-ratio:16/10;background:#000;display:block;width:100%;object-fit:cover}
  .body{padding:14px 16px 16px}
  .title{font-weight:800;font-size:19px;margin:0 0 4px}
  .desc{color:var(--muted);font-size:14px;margin:0 0 12px}
  .play{display:inline-flex;align-items:center;gap:6px;background:var(--accent2);color:#1a1300;font-weight:800;border-radius:10px;padding:7px 14px;font-size:14px}
  .soon{opacity:.55;pointer-events:none}
  .soon .thumb{display:grid;place-items:center;font-size:48px;background:repeating-linear-gradient(45deg,#221e3a 0 14px,#1b1830 14px 28px)}
  .soon .play{background:#ffffff22;color:var(--muted)}
  footer{margin-top:48px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="logo">🎮</div><div class="brand">TAILERS WORLD LV</div></header>
  <h1>Labdien! <span>👋</span></h1>
  <p class="lead">Laipni lūgti Tailers World LV – mūsu mini spēļu pasaulē. Izvēlies spēli un spied, lai sāktu spēlēt.</p>

  <h2>Spēles</h2>
  <div class="grid" id="games"></div>

  <footer>© Tailers World LV · Mūzika: Papīra Lidmašīnas</footer>
</div>
<script>
// Spēļu saraksts – jaunu spēli pievieno šeit
const GAMES=[
  {title:'Graffiti RPG', desc:'Skrien pa ielu, zīmē grafiti, krāj naudu, pērc krāsas un mašīnas – un bēdz no policijas.', cover:'grafiti/cover.svg', url:'grafiti/index.html'},
];
const SOON=1; // cik "drīzumā" kartītes rādīt
const el=document.getElementById('games');
GAMES.forEach(g=>{
  const a=document.createElement('a'); a.className='card'; a.href=g.url;
  a.innerHTML=`<img class="thumb" src="${g.cover}" alt="${g.title}"><div class="body"><p class="title">${g.title}</p><p class="desc">${g.desc}</p><span class="play">▶ Spēlēt</span></div>`;
  el.appendChild(a);
});
for(let i=0;i<SOON;i++){
  const d=document.createElement('div'); d.className='card soon';
  d.innerHTML=`<div class="thumb">🔒</div><div class="body"><p class="title">Drīzumā</p><p class="desc">Nākamā mini spēle jau top.</p><span class="play">Drīzumā</span></div>`;
  el.appendChild(d);
}
</script>
</body>
</html>
