<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<title>Citi spēlētāji – Tailers World LV</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120f24">
<style>
  body{margin:0;min-height:100vh;background:radial-gradient(900px 600px at 20% -10%,#4a2a8a 0%,transparent 60%),#120f24;color:#fff8ff;font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:24px;box-sizing:border-box;text-align:center}
  .box{max-width:460px;animation:rise .6s both}
  .big{font-size:72px;animation:bob 2.6s ease-in-out infinite}
  h1{font-size:30px;margin:8px 0}
  p{color:#c4bde6;font-size:17px}
  a{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:12px 22px;border-radius:16px;background:#ffd34d;color:#1a1300;font-weight:900;font-size:17px;text-decoration:none;box-shadow:0 6px 0 #c49a1b;margin-top:12px}
  @keyframes bob{50%{transform:translateY(-8px)}}
  @keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="box">
  <div class="big">👥</div>
  <h1>Citi spēlētāji</h1>
  <p>Drīzumā te redzēsi citus spēlētājus, viņu līmeņus un rekordus – kurš ticis vistālāk?</p>
  <a href="index.html">← Atpakaļ</a>
</div>
</body>
</html>
